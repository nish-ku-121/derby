# ActorCritic adaptive step-rate treatment on top of Control 2.
# learning_rate is an optimizer placeholder; adaptive mode replaces it per update.
sweep_name: actor_critic_adaptive_step_rate
base_config: configs/actor_critic_control_base.yaml
override:
  agents.0.label: "ActorCritic|TD|AdaptiveStepRate|Init=zeros|Seed={seed}|Eps={agents.0.params.adaptive_lr_epsilon}|Eta={agents.0.params.adaptive_lr_eta}|BaseLRPlaceholder={agents.0.params.learning_rate}"
  agents.0.params.learning_rate: 1e-6
  agents.0.params.param_kernel_initializer: zeros
  agents.0.params.init_action_center: 10.0
  agents.0.params.init_action_stddev: 0.5
  agents.0.params.min_action_stddev: 0.1
  agents.0.params.shape_reward: false
  agents.0.params.adaptive_learning_rate: true
  agents.0.params.adaptive_lr_eta: 1e-12
grid:
  seed: [123, 456, 789]
  agents.0.params.adaptive_lr_epsilon: [1e-8, 1e-7, 1e-6]
