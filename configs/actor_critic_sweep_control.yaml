# Full untreated ActorCritic Control 1 sweep.
# Generate concrete configs with:
#   make run ARGS="python -u -m pipeline.make_config_grid --spec configs/actor_critic_sweep_control.yaml --output-dir sweeps/actor_critic_sweep_control/configs"

sweep_name: actor_critic_sweep_control
base_config: configs/actor_critic_control_base.yaml
override:
  agents.0.label: "ActorCritic|TD|A={agents.0.params.actor_hidden_layers}x{agents.0.params.actor_hidden_units}|C={agents.0.params.critic_hidden_layers}x{agents.0.params.critic_hidden_units}|Act={agents.0.params.actor_hidden_activation}>{agents.0.params.actor_final_activation}|LR={agents.0.params.learning_rate}|ParamInit={agents.0.params.param_kernel_initializer}"
grid:
  seed: [123, 456, 789]
  agents.0.params.learning_rate: [1e-9, 1e-8, 1e-7]
