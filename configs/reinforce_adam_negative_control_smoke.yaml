# 50-epoch Adam negative-control smoke matched to REINFORCE Control 2.
sweep_name: reinforce_adam_negative_control_smoke
base_config: configs/one_camp_n_days_base.yaml
override:
  agents.0.policy: REINFORCE
  agents.0.label: "{agents.0.policy}|AdamNegativeControlSmoke|Baseline={agents.0.params.use_baseline}|LR={agents.0.params.learning_rate}|Hidden={agents.0.params.actor_hidden_activation}|Init={agents.0.params.param_kernel_initializer}"
  num_days: 5
  num_trajs: 50
  num_epochs: 50
  agents.0.params.shape_reward: false
  agents.0.params.adaptive_learning_rate: false
  agents.0.params.init_action_center: 10.0
  agents.0.params.init_action_stddev: 0.5
  agents.0.params.min_action_stddev: 0.1
  agents.0.params.actor_hidden_activation: relu
  agents.0.params.actor_final_activation: relu
  agents.0.params.optimizer: adam
grid:
  seed: [123, 456, 789]
  agents.0.params.learning_rate: [1e-7, 1e-6, 1e-5]
  agents.0.params.dist_type: [gaussian]
  agents.0.params.use_baseline: [false, true]
  agents.0.params.param_kernel_initializer: [zeros]
