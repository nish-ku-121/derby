# 50-epoch Adam negative-control smoke matched to ActorCritic Control 2.
sweep_name: actor_critic_adam_negative_control_smoke
base_config: configs/actor_critic_control_base.yaml
override:
  num_epochs: 50
  agents.0.label: "ActorCritic|TD|AdamNegativeControlSmoke|Seed={seed}|LR={agents.0.params.learning_rate}|Hidden={agents.0.params.actor_hidden_activation}|Init={agents.0.params.param_kernel_initializer}"
  agents.0.params.param_kernel_initializer: zeros
  agents.0.params.init_action_center: 10.0
  agents.0.params.init_action_stddev: 0.5
  agents.0.params.min_action_stddev: 0.1
  agents.0.params.shape_reward: false
  agents.0.params.adaptive_learning_rate: false
  agents.0.params.actor_hidden_activation: relu
  agents.0.params.actor_final_activation: relu
  agents.0.params.optimizer: adam
grid:
  seed: [123, 456, 789]
  agents.0.params.learning_rate: [1e-9, 1e-8, 1e-7]
