# REINFORCE sweep with action-distribution initialization as the only treatment.
# Generate concrete configs with:
#   make run ARGS="python -u -m pipeline.make_config_grid --spec configs/reinforce_sweep_treatment_action_centering.yaml --output-dir sweeps/reinforce_sweep_treatment_action_centering/configs"

sweep_name: reinforce_sweep_treatment_action_centering
base_config: configs/one_camp_n_days_base.yaml
override:
  agents.0.policy: REINFORCE
  agents.0.label: "{agents.0.policy}|Baseline={agents.0.params.use_baseline}|D={agents.0.params.dist_type}|A={agents.0.params.actor_hidden_layers}x{agents.0.params.actor_hidden_units}|C={agents.0.params.critic_hidden_layers}x{agents.0.params.critic_hidden_units}|Act={agents.0.params.actor_hidden_activation}>{agents.0.params.actor_final_activation}|BaseLR={agents.0.params.learning_rate}|ActionCenter={agents.0.params.init_action_center}|ActionStd={agents.0.params.init_action_stddev}|MinActionStd={agents.0.params.min_action_stddev}"
  num_days: 5
  num_trajs: 50
  num_epochs: 500
  agents.0.params.shape_reward: false
  agents.0.params.adaptive_learning_rate: false
  # agents.0.params.adaptive_lr_epsilon: 1e-8
  # agents.0.params.adaptive_lr_eta: 1e-12
  agents.0.params.init_action_center: 10.0
  agents.0.params.init_action_stddev: 0.5
  agents.0.params.min_action_stddev: 0.1
grid:
  seed: [123, 456, 789]
  agents.0.params.learning_rate: [1e-6, 1e-5, 1e-7]
  agents.0.params.dist_type: [gaussian]
  agents.0.params.actor_hidden_activation: [relu]
  agents.0.params.actor_final_activation: [relu]
  agents.0.params.use_baseline: [false, true]
  agents.0.params.param_kernel_initializer: [glorot_uniform]
restrict:
  # max_combinations: 1  # enable for a smoke generation/run
