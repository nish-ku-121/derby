# ActorCritic bias-centered Glorot semi-ablation.
# Generate concrete configs with:
#   make run ARGS="python -u -m pipeline.make_config_grid --spec configs/actor_critic_sweep_bias_centered_glorot.yaml --output-dir sweeps/actor_critic_sweep_bias_centered_glorot/configs"

sweep_name: actor_critic_sweep_bias_centered_glorot
base_config: configs/actor_critic_control_base.yaml
override:
  agents.0.label: "ActorCritic|TD|BiasCenteredGlorot|A={agents.0.params.actor_hidden_layers}x{agents.0.params.actor_hidden_units}|C={agents.0.params.critic_hidden_layers}x{agents.0.params.critic_hidden_units}|Act={agents.0.params.actor_hidden_activation}>{agents.0.params.actor_final_activation}|LR={agents.0.params.learning_rate}|Center={agents.0.params.init_action_center}|Std={agents.0.params.init_action_stddev}|MinStd={agents.0.params.min_action_stddev}"
  agents.0.params.init_action_center: 10.0
  agents.0.params.init_action_stddev: 0.5
  agents.0.params.min_action_stddev: 0.1
grid:
  seed: [123, 456, 789]
  agents.0.params.learning_rate: [1e-9, 1e-8, 1e-7]
