# Seed-123 validation of the combined-treatment optimizer and epsilon factorial.
sweep_name: actor_critic_combined_optimizer_epsilon_smoke
base_config: configs/actor_critic_control_base.yaml
override:
  agents.0.label: "ActorCritic|TD|CombinedOptEpsSmoke|Opt={agents.0.params.optimizer}|Seed={seed}|Hidden={agents.0.params.actor_hidden_activation}|Final={agents.0.params.actor_final_activation}|Eps={agents.0.params.adaptive_lr_epsilon}|Eta={agents.0.params.adaptive_lr_eta}|Init={agents.0.params.param_kernel_initializer}"
  num_epochs: 50
  agents.0.params.learning_rate: 1e-6
  agents.0.params.param_kernel_initializer: zeros
  agents.0.params.init_action_center: 10.0
  agents.0.params.init_action_stddev: 0.5
  agents.0.params.min_action_stddev: 0.1
  agents.0.params.shape_reward: false
  agents.0.params.adaptive_learning_rate: true
  agents.0.params.adaptive_lr_eta: 1e-12
grid:
  seed: [123]
  agents.0.params.optimizer: [sgd, adam]
  agents.0.params.adaptive_lr_epsilon: [1e-8, 1e-7, 1e-6]
  agents.0.params.actor_hidden_activation: [relu, elu]
  agents.0.params.actor_final_activation: [softplus]
